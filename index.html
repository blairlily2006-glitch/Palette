<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#EEF9FF">
  <link rel="icon" type="image/png" href="assets/palette-mascot.png">
  <link rel="stylesheet" href="app.css">
  <title>Palette</title>
</head>
<body>
<div id="app">
  <div class="splash-screen" id="splashScreen" aria-label="Palette">
    <img src="assets/palette-mascot.png" alt="">
    <span class="splash-wordmark">Palette</span>
  </div>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="assets/palette-mascot.png" alt=""><span class="brand-name">Palette</span></div>
    <div class="top-actions" aria-label="照片操作">
      <button class="top-action" id="quickUpload" aria-label="导入照片">＋</button>
      <button class="top-action" id="saveRecipe" aria-label="保存配方">▣</button>
      <button class="top-action" id="clearPhoto" aria-label="清空照片">×</button>
    </div>
  </header>
  <main id="mainContent">
    <section class="view active" id="view-home" aria-label="取色">
      <div class="home">
        <div class="home-showcase photo-panel" id="photoPanel">
          <img id="photo" alt="当前取色照片">
          <div class="photo-placeholder" id="photoPlaceholder">
            <button class="upload-symbol" id="homeUpload" aria-label="从相册选择照片">＋</button>
          </div>
          <i class="sample-marker" id="sampleMarker" aria-hidden="true"></i>
          <div class="sample-readout" id="sampleReadout">
            <strong>当前取色样</strong>
            <span class="sample-readout-bottom"><i class="sample-swatch" id="targetSwatch"></i><small id="targetHex">#B9D6B6</small></span>
          </div>
        </div>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <div class="medium-switch" id="mediumSwitch" role="group" aria-label="绘画媒介">
          <button data-medium="水彩">水彩</button><button class="active" data-medium="丙烯">丙烯</button><button data-medium="油画">油画</button>
        </div>
        <section class="home-recipe recipe-panel" id="recipePanel">
          <div class="recipe-heading"><strong>颜料搭配比例</strong><small>混色估算 · 仅作试调参考</small></div>
          <div class="recipe-box" id="recipeList"></div>
        </section>
      </div>
    </section>
    <section class="view" id="view-saved" aria-label="配色记录">
      <div class="page-head"><h1>配色记录</h1><p>保存过的颜色和混合比例</p></div>
      <div class="record-list" id="savedList"></div>
    </section>
    <section class="view" id="view-pigments" aria-label="我的颜料">
      <div class="page-head"><h1>我的颜料</h1><p>增加你的颜色</p></div>
      <div class="medium-switch pigment-medium" id="pigmentMedium" role="group" aria-label="颜料媒介">
        <button data-medium="水彩">水彩</button><button class="active" data-medium="丙烯">丙烯</button><button data-medium="油画">油画</button>
      </div>
      <div class="tools"><input class="search" id="searchPigments" placeholder="搜索颜料名称" aria-label="搜索颜料名称"><button class="add-btn" id="addPigment" aria-label="添加自定义颜料">＋</button></div>
      <div class="pigment-list" id="pigmentList"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="active" data-view="home" aria-label="取色页"><span class="nav-icon nav-sample" aria-hidden="true"></span></button>
    <button data-view="saved" aria-label="配色记录"><span class="nav-icon nav-record" aria-hidden="true"></span></button>
    <button data-view="pigments" aria-label="我的颜料"><span class="nav-icon nav-pigments" aria-hidden="true"></span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal-backdrop" id="modal">
  <form class="modal" id="pigmentForm">
    <h2>添加自定义颜料</h2>
    <div class="field"><label for="newName">颜料名称</label><input id="newName" required placeholder="例如：青莲"></div>
    <div class="field"><label for="newColor">颜色预览</label><input id="newColor" type="color" value="#c77da6"></div>
    <div class="modal-actions"><button type="button" class="secondary" id="cancelModal">取消</button><button class="primary">添加</button></div>
  </form>
</div>
<div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="false"><span><i class="spinner"></i>正在载入…</span></div>
<script>
(()=>{
  const seed=[
    {id:"ultra",name:"群青",color:"#46577D",type:"蓝色",media:["水彩","丙烯","油画"]},
    {id:"cerulean",name:"天蓝",color:"#7CA8B4",type:"蓝色",media:["水彩","丙烯","油画"]},
    {id:"lemon",name:"柠檬黄",color:"#E6D66B",type:"黄色",media:["水彩","丙烯","油画"]},
    {id:"ochre",name:"黄赭",color:"#BB8D4D",type:"黄色",media:["水彩","丙烯","油画"]},
    {id:"sienna",name:"熟褐",color:"#9C5C45",type:"红棕色",media:["水彩","丙烯","油画"]},
    {id:"alizarin",name:"曙红",color:"#A94F61",type:"红色",media:["水彩","丙烯","油画"]},
    {id:"viridian",name:"翠绿",color:"#5E896A",type:"绿色",media:["水彩","丙烯","油画"]},
    {id:"sap",name:"草绿",color:"#78934C",type:"绿色",media:["水彩","丙烯","油画"]},
    {id:"white",name:"钛白",color:"#F1EEE2",type:"白色",media:["丙烯","油画"]},
    {id:"black",name:"象牙黑",color:"#454742",type:"黑色",media:["丙烯","油画"]}
  ];
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(`shise-${key}`))??fallback}catch{return fallback}};
  const state={view:"home",medium:"丙烯",target:"#B9D6B6",photoUrl:"",custom:[],feedback:0,sample:{x:.55,y:.48}};
  state.custom=read("custom",[]);
  let saved=read("saved",[]);
  let checked=read("checkedByMedium",{水彩:["ultra","ochre","sienna","alizarin"],丙烯:["ultra","lemon","sap"],油画:["ultra","ochre","sienna","white"]});
  let recipe=[];
  const all=()=>[...seed,...state.custom],activeIds=()=>checked[state.medium]||[];
  const rgb=h=>{const v=h.replace("#","");return[0,2,4].map(i=>parseInt(v.slice(i,i+2),16))};
  const hex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();
  const quantize=n=>Math.max(0,Math.min(255,Math.round(n/16)*16));
  const quantizedHex=a=>hex(a.map(quantize));
  const luminance=h=>{const c=rgb(h).map(v=>v/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
  const saturation=h=>{const c=rgb(h).map(v=>v/255),max=Math.max(...c),min=Math.min(...c);return max===0?0:(max-min)/max};
  const sortPalette=colors=>colors.sort((a,b)=>luminance(b)-luminance(a)||saturation(b)-saturation(a));
  const fallbackPalette=()=>["#F0D8E0","#D0C0E0","#B0C8C0","#90B0C0","#D0B080","#806070"];
  function applyTheme(colors){
    const palette=sortPalette([...new Set(colors)].slice(0,6));
    const top=palette.slice(0,3).reduce((sum,color)=>sum.map((v,i)=>v+rgb(color)[i]/3),[0,0,0]);
    const bottom=palette.slice(-3).reduce((sum,color)=>sum.map((v,i)=>v+rgb(color)[i]/3),[0,0,0]);
    const root=document.documentElement;
    root.style.setProperty("--bg-top",quantizedHex(top.map(v=>v*1.1)));
    root.style.setProperty("--bg-bottom",quantizedHex(bottom.map(v=>v*.85)));
    root.style.setProperty("--panel",quantizedHex(bottom.map(v=>Math.min(255,v*.95+28))));
    palette.forEach((color,index)=>root.style.setProperty(`--swatch-${index+1}`,color));
    document.querySelector('meta[name="theme-color"]').content=quantizedHex(top.map(v=>v*1.1));
  }
  async function extractPalette(image){
    const canvas=document.createElement("canvas"),scale=Math.min(1,64/Math.max(image.naturalWidth,image.naturalHeight));
    canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    const context=canvas.getContext("2d",{willReadFrequently:true});context.drawImage(image,0,0,canvas.width,canvas.height);
    const pixels=context.getImageData(0,0,canvas.width,canvas.height).data,buckets=new Map();
    for(let i=0;i<pixels.length;i+=4){if(pixels[i+3]<180)continue;const color=[pixels[i],pixels[i+1],pixels[i+2]],key=color.map(quantize).join(",");buckets.set(key,(buckets.get(key)||0)+1)}
    const result=[...buckets.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([key])=>quantizedHex(key.split(",").map(Number)));
    while(result.length<6)result.push(fallbackPalette()[result.length]);
    return sortPalette(result);
  }
  function toast(message){const node=$("#toast");node.textContent=message;node.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove("show"),1800)}
  function setLoading(show){const node=$("#loadingOverlay");node.classList.toggle("show",show);node.setAttribute("aria-busy",String(show))}
  function navigate(view){
    state.view=view;
    $$(".view").forEach(node=>node.classList.toggle("active",node.id===`view-${view}`));
    $$(".bottom-nav button").forEach(node=>node.classList.toggle("active",node.dataset.view===view));
    if(view==="saved")renderSaved();
    if(view==="pigments")renderPigments();
  }
  function renderPigments(){
    const query=$("#searchPigments").value.trim().toLowerCase();
    const pigments=all().filter(p=>p.media.includes(state.medium)&&p.name.toLowerCase().includes(query));
    $("#pigmentList").innerHTML=pigments.map(p=>`<label class="pigment-item"><input type="checkbox" data-id="${p.id}" ${activeIds().includes(p.id)?"checked":""}><i class="pigment-chip" style="--c:${p.color}"></i><strong>${p.name}</strong></label>`).join("")||'<p class="empty">没有找到颜料</p>';
    $$("#pigmentMedium [data-medium]").forEach(button=>button.classList.toggle("active",button.dataset.medium===state.medium));
  }
  function renderRecipe(){
    if(!state.photoUrl){recipe=[];$("#recipeList").innerHTML="";return}
    const candidates=activeIds().map(id=>all().find(p=>p.id===id)).filter(Boolean)
      .sort((a,b)=>rgb(a.color).reduce((sum,v,i)=>sum+(v-rgb(state.target)[i])**2,0)-rgb(b.color).reduce((sum,v,i)=>sum+(v-rgb(state.target)[i])**2,0)).slice(0,4);
    if(!candidates.length){recipe=[];$("#recipeList").innerHTML="";return}
    let weights=candidates.map(p=>1/Math.max(30,Math.sqrt(rgb(p.color).reduce((sum,v,i)=>sum+(v-rgb(state.target)[i])**2,0))));
    if(state.feedback%2&&weights.length>1)weights[0]*=1.35;
    const total=weights.reduce((a,b)=>a+b,0);
    recipe=candidates.map((p,i)=>({id:p.id,name:p.name,color:p.color,pct:Math.round(weights[i]/total*100)}));
    recipe[0].pct+=100-recipe.reduce((sum,p)=>sum+p.pct,0);
    $("#recipeList").innerHTML=recipe.map(p=>`<div class="recipe-row"><i class="pigment-dot" style="--c:${p.color}"></i><span class="recipe-name">${p.name}</span><span class="percent">${p.pct}%</span><span class="bar"><i style="--p:${p.pct}%;--c:${p.color}"></i></span></div>`).join("");
  }
  function placeReadout(x,y){
    const panel=$("#photoPanel"),readout=$("#sampleReadout"),rect=panel.getBoundingClientRect();
    const left=x>.66?Math.max(8,x*rect.width-130):Math.min(rect.width-132,x*rect.width+18);
    const top=Math.max(8,Math.min(rect.height-82,y*rect.height-28));
    readout.style.left=`${left}px`;readout.style.top=`${top}px`;
  }
  function updateTarget(color){
    state.target=color.toUpperCase();state.feedback=0;
    $("#targetSwatch").style.background=state.target;$("#targetHex").textContent=state.target;
    $("#sampleMarker").style.background=state.target;renderRecipe();
  }
  function sampleAt(x,y){
    state.sample={x,y};const marker=$("#sampleMarker");
    marker.style.left=`${x*$("#photoPanel").clientWidth}px`;marker.style.top=`${y*$("#photoPanel").clientHeight}px`;
    placeReadout(x,y);
    try{
      const image=$("#photo"),canvas=document.createElement("canvas"),context=canvas.getContext("2d",{willReadFrequently:true});
      canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;context.drawImage(image,0,0);
      const bounds=$("#photoPanel").getBoundingClientRect(),scale=Math.max(bounds.width/canvas.width,bounds.height/canvas.height);
      const offsetX=(bounds.width-canvas.width*scale)/2,offsetY=(bounds.height-canvas.height*scale)/2;
      const px=Math.max(0,Math.min(canvas.width-1,Math.floor((x*bounds.width-offsetX)/scale)));
      const py=Math.max(0,Math.min(canvas.height-1,Math.floor((y*bounds.height-offsetY)/scale)));
      const color=context.getImageData(px,py,1,1).data;updateTarget(hex([color[0],color[1],color[2]]));
    }catch{toast("无法读取图片颜色，请重新选择")}
  }
  function renderSaved(){
    $("#savedList").innerHTML=saved.length?saved.map(item=>`<article class="record-item"><i class="record-color" style="--c:${item.target}"></i><div><strong>${item.name}</strong><small>${item.medium} · ${item.recipe.map(p=>`${p.name} ${p.pct}%`).join(" · ")}</small></div><time>${item.date}</time></article>`).join(""):'<div class="saved-empty"><p>还没有配色方案</p><small>保存的配方将会保存到这里</small></div>';
  }
  $("#homeUpload").onclick=()=>$("#fileInput").click();$("#quickUpload").onclick=()=>$("#fileInput").click();
  $("#fileInput").onchange=event=>{
    const file=event.target.files[0];if(!file)return;
    setLoading(true);if(state.photoUrl.startsWith("blob:"))URL.revokeObjectURL(state.photoUrl);
    state.photoUrl=URL.createObjectURL(file);const image=$("#photo");
    image.onload=async()=>{
      applyTheme(await extractPalette(image));$("#photoPanel").classList.add("has-image");
      sampleAt(state.sample.x,state.sample.y);navigate("home");setTimeout(()=>setLoading(false),250);
    };
    image.onerror=()=>{setLoading(false);toast("照片无法载入，请重试")};
    image.src=state.photoUrl;event.target.value="";
  };
  let samplingPointer=null;
  $("#photoPanel").onpointerdown=event=>{
    if(event.target.closest("button,.sample-readout")||!state.photoUrl||event.button!==0)return;
    samplingPointer=event.pointerId;event.currentTarget.setPointerCapture(event.pointerId);
    const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
    sampleAt(Math.max(0,Math.min(1,x)),Math.max(0,Math.min(1,y)));
  };
  $("#photoPanel").onpointermove=event=>{
    if(samplingPointer!==event.pointerId||!state.photoUrl)return;
    const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
    sampleAt(Math.max(0,Math.min(1,x)),Math.max(0,Math.min(1,y)));
  };
  $("#photoPanel").onpointerup=event=>{if(samplingPointer===event.pointerId)samplingPointer=null};
  $("#photoPanel").onpointercancel=event=>{if(samplingPointer===event.pointerId)samplingPointer=null};
  $("#photoPanel").onclick=event=>{
    if(event.target.closest("button,.sample-readout")||!state.photoUrl)return;
    const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width,y=(event.clientY-rect.top)/rect.height;
    sampleAt(Math.max(0,Math.min(1,x)),Math.max(0,Math.min(1,y)));
  };
  $("#clearPhoto").onclick=()=>{
    if(state.photoUrl.startsWith("blob:"))URL.revokeObjectURL(state.photoUrl);
    state.photoUrl="";$("#photo").removeAttribute("src");$("#photoPanel").classList.remove("has-image");
    document.documentElement.style.removeProperty("--bg-top");document.documentElement.style.removeProperty("--bg-bottom");
    document.querySelector('meta[name="theme-color"]').content="#EEF9FF";updateTarget("#B9D6B6");
  };
  $("#mediumSwitch").onclick=event=>{
    const button=event.target.closest("[data-medium]");if(!button)return;
    state.medium=button.dataset.medium;$$("[data-medium]",$("#mediumSwitch")).forEach(item=>item.classList.toggle("active",item===button));
    renderRecipe();
  };
  $("#pigmentMedium").onclick=event=>{
    const button=event.target.closest("[data-medium]");if(!button)return;state.medium=button.dataset.medium;
    renderPigments();renderRecipe();
  };
  $("#pigmentList").onchange=event=>{
    const input=event.target.closest("[data-id]");if(!input)return;
    const ids=new Set(activeIds());input.checked?ids.add(input.dataset.id):ids.delete(input.dataset.id);
    checked[state.medium]=[...ids];localStorage.setItem("shise-checkedByMedium",JSON.stringify(checked));
    renderPigments();renderRecipe();
  };
  $("#searchPigments").oninput=renderPigments;
  $("#saveRecipe").onclick=()=>{
    if(!recipe.length){toast("请先选择参与调色的颜料");return}
    saved.unshift({name:`写生色 ${saved.length+1}`,date:new Date().toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"}),medium:state.medium,target:state.target,recipe:recipe.map(item=>({...item}))});
    localStorage.setItem("shise-saved",JSON.stringify(saved));toast("已保存到配色记录");
  };
  $$(".bottom-nav [data-view]").forEach(button=>button.onclick=()=>navigate(button.dataset.view));
  $("#addPigment").onclick=()=>$("#modal").classList.add("open");
  $("#cancelModal").onclick=()=>$("#modal").classList.remove("open");
  $("#modal").onclick=event=>{if(event.target.id==="modal")$("#modal").classList.remove("open")};
  $("#pigmentForm").onsubmit=event=>{
    event.preventDefault();
    const pigment={id:`custom-${Date.now()}`,name:$("#newName").value.trim(),color:$("#newColor").value,type:"自定义",media:["水彩","丙烯","油画"]};
    state.custom.push(pigment);localStorage.setItem("shise-custom",JSON.stringify(state.custom));
    checked[state.medium]=[...activeIds(),pigment.id];localStorage.setItem("shise-checkedByMedium",JSON.stringify(checked));
    event.target.reset();$("#modal").classList.remove("open");renderPigments();renderRecipe();
  };
  $("#sampleMarker").style.left=`${state.sample.x*100}%`;$("#sampleMarker").style.top=`${state.sample.y*100}%`;
  renderRecipe();renderSaved();renderPigments();
  setTimeout(()=>$("#splashScreen").classList.add("is-hidden"),1500);
})();
</script>
</body>
</html>
